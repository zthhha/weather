spring:
  application:
    name: weather
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/weather_dashboard?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:weather-dashboard-development-jwt-secret-must-be-at-least-32-bytes}
    expiration: PT24H
  qweather:
    base-url: ${QWEATHER_BASE_URL:https://k3564ut895.re.qweatherapi.com}
    geo-base-url: ${QWEATHER_GEO_BASE_URL:https://k3564ut895.re.qweatherapi.com}
    api-key: ${QWEATHER_API_KEY:4f9d235ca8ef4564b5f693d49acff3b8}
    connect-timeout: PT5S
    read-timeout: PT10S
  collection:
    enabled: ${COLLECTION_ENABLED:true}
    fixed-delay: ${COLLECTION_FIXED_DELAY:PT5M}
