spring:
  application:
    name: weather
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/weather_dashboard?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  qweather:
    base-url: ${QWEATHER_BASE_URL:https://devapi.qweather.com}
    api-key: ${QWEATHER_API_KEY:}
    connect-timeout: PT5S
    read-timeout: PT10S
  collection:
    enabled: ${COLLECTION_ENABLED:true}
    fixed-delay: ${COLLECTION_FIXED_DELAY:PT5M}
