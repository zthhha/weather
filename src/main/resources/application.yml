spring:
  application:
    name: weather
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/weather_dashboard?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:weather-dashboard-development-jwt-secret-must-be-at-least-32-bytes}
    expiration: PT24H
  qweather:
    base-url: ${QWEATHER_BASE_URL:https://k3564ut895.re.qweatherapi.com}
    geo-base-url: ${QWEATHER_GEO_BASE_URL:https://k3564ut895.re.qweatherapi.com}
    key-id: ${QWEATHER_KID:KAB6RTEHGH}
    issuer: ${QWEATHER_ISSUER:Q0591D7395}
    subject: ${QWEATHER_SUBJECT:25TQ67RV72}
    private-key: ${QWEATHER_PRIVATE_KEY:MC4CAQAwBQYDK2VwBCIEIE5LvSULHm1/QxBx8dBMe3aFgEvjKkBMwMOw3WWKMrgA}
    token-validity: ${QWEATHER_TOKEN_VALIDITY:PT24H}
    refresh-threshold: ${QWEATHER_REFRESH_THRESHOLD:PT1H}
    connect-timeout: PT5S
    read-timeout: PT10S
  collection:
    enabled: ${COLLECTION_ENABLED:true}
    fixed-delay: ${COLLECTION_FIXED_DELAY:PT5M}
