spring:
  datasource:
    url: jdbc:h2:mem:weather;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  jwt:
    secret: test-secret-that-is-long-enough-for-hmac-sha-256
    expiration: PT24H
  qweather:
    base-url: https://example.test
    geo-base-url: https://example.test
    key-id: test-key-id
    issuer: Q123456789
    subject: TESTPROJECT
    private-key: MC4CAQAwBQYDK2VwBCIEIJM86MntfqnB5w+lzW4lJwC1i7F0x/JWzkx6HehUYvJc
    token-validity: PT24H
    refresh-threshold: PT1H
    connect-timeout: PT5S
    read-timeout: PT10S
  collection:
    enabled: false
    fixed-delay: PT5M
